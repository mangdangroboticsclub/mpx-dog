<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="64" fill="#1e1e2e"/>
  <g fill="none" stroke="#d35400" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <!-- Body -->
    <rect x="140" y="200" width="232" height="120" rx="20"/>
    <!-- Head -->
    <rect x="300" y="120" width="120" height="100" rx="16"/>
